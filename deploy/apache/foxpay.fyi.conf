<IfModule remoteip_module>
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32
    RemoteIPTrustedProxy 2606:4700::/32
    RemoteIPTrustedProxy 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32
    RemoteIPTrustedProxy 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32
</IfModule>

<VirtualHost *:80>
    ServerName foxpay.fyi
    RewriteEngine On
    RewriteRule ^ https://foxpay.fyi%{REQUEST_URI} [END,NE,R=301]

    ErrorLog ${APACHE_LOG_DIR}/foxpay_http_error.log
    CustomLog ${APACHE_LOG_DIR}/foxpay_http_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName foxpay.fyi

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/foxpay.fyi.pem
    SSLCertificateKeyFile /etc/apache2/ssl/foxpay.fyi.key
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Replace app-level copies so each security header is emitted once.
    Header onsuccess unset Strict-Transport-Security
    Header always unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000"
    Header onsuccess unset X-Content-Type-Options
    Header always unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header onsuccess unset X-Frame-Options
    Header always unset X-Frame-Options
    Header always set X-Frame-Options "DENY"
    Header onsuccess unset Referrer-Policy
    Header always unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    Alias /static /var/www/FoxPay/staticfiles
    <Directory "/var/www/FoxPay/staticfiles">
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=3600"
    </Directory>

    Alias /.well-known/apple-developer-merchantid-domain-association /var/www/apple-pay/foxpay.fyi/apple-developer-merchantid-domain-association
    <Directory "/var/www/apple-pay/foxpay.fyi">
        Require all granted
        Options -Indexes
        <Files apple-developer-merchantid-domain-association>
            ForceType text/plain
        </Files>
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 90
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP early
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass /static !
    ProxyPass /.well-known/apple-developer-merchantid-domain-association !
    ProxyPass        / http://127.10.0.11:8000/ connectiontimeout=10 timeout=90
    ProxyPassReverse / http://127.10.0.11:8000/

    ErrorLog ${APACHE_LOG_DIR}/foxpay_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/foxpay_ssl_access.log combined
</VirtualHost>
</IfModule>
